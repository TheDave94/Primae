name: "iOS Build & Test"
on:
  push:
    branches: ["main", "ux/**", "roadmap-*"]
  pull_request:
    branches: ["main", "ux/**", "roadmap-*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stroke_audit:
    name: "Skeleton & stroke audit (advisory)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scikit-image / pillow / numpy / fonttools
        run: pip install --quiet pillow numpy "scikit-image>=0.21" fonttools
      - name: Skeleton audit
        run: |
          # Without a `shell:` key GitHub runs `bash -e` with NO pipefail,
          # so this step's status was `tee`'s and the script's exit code
          # never reached the job — it had been exiting 1 on every run
          # (37 static-artifact letters reported as anchor errors) while
          # the job showed green (2026-09-04). The job stays advisory by
          # design; the exit code is now surfaced as a warning annotation
          # instead of being lost.
          set +e
          python3 scripts/skeleton_audit.py --anchor-drift-pct 10 \
            | tee /tmp/skeleton-audit.txt
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Skeleton audit::skeleton_audit.py exited $rc — advisory, job stays green; read the step log"
          fi
      # scripts/tests/ (80 pytest-style functions, incl. the design-token
      # drift gate) were executed by no workflow until 2026-09-04. Advisory
      # on first wiring — pytest could not be installed from the audit seat
      # to prove them green — and surfaced as a warning annotation, not
      # masked; promote to a hard step once one run has been read.
      - name: Script tests (advisory until first green run is read)
        run: |
          pip install --quiet pytest
          if ! python3 -m pytest scripts/tests -q; then
            echo "::warning title=scripts/tests::pytest reported failures — advisory; read the step log"
          fi
      - name: Stroke artifact scan
        run: |
          python3 - <<'PY'
          import json, math, pathlib, sys
          def angle(a,b,c):
              v1=(b[0]-a[0],b[1]-a[1]); v2=(c[0]-b[0],c[1]-b[1])
              n1=math.hypot(*v1); n2=math.hypot(*v2)
              if n1==0 or n2==0: return 0
              d=max(-1,min(1,(v1[0]*v2[0]+v1[1]*v2[1])/(n1*n2)))
              return math.degrees(math.acos(d))
          warnings=[]
          for f in sorted(pathlib.Path('PrimaeNative/Resources/Letters').rglob('strokes.json')):
              d=json.load(f.open())
              L=f.parent.name.replace('_l','')
              for s in d['strokes']:
                  cps=[(c['x'],c['y']) for c in s['checkpoints']]
                  if len(cps)<3: continue
                  worst=max(angle(cps[i-1],cps[i],cps[i+1]) for i in range(1,len(cps)-1))
                  if worst>150:
                      warnings.append(f"{L} s{s['id']}: {worst:.0f}° kink")
          if warnings:
              print("Stroke artifact warnings (kink >150°):")
              for w in warnings: print("  "+w)
              sys.exit(0)  # advisory; do not fail CI
          print("No retrace/spike artifacts found.")
          PY

  unwired_guards:
    name: "Unwired-guard gate (macos-26 / Xcode 26)"
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # macos, not ubuntu, and that is load-bearing. The gate PROBES each
      # --self-test by running it, so every probed script must be able to
      # reach its own self-test branch here. typecheck_package.sh checks for
      # xcrun before it dispatches, so on a runner without Xcode it would
      # exit early and the gate would report a guard as unreachable when it
      # is merely unhosted. Invoking rather than grepping is what makes the
      # gate trustworthy; this is the cost of that choice.
      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      # FIRST, prove the gate can fail. A scan trusted before its own
      # self-test has run is a scan whose CLEAN means nothing — and this
      # step is also what keeps the gate's --self-test dispatched to on
      # every run, rather than only when someone remembers.
      - name: "Prove the gate can fail (--self-test)"
        run: sh scripts/check_unwired_guards.sh --self-test

      # THEN scan. Non-zero exit fails the job and therefore the build; the
      # gate reports nothing it does not also fail on.
      - name: "Scan for guards that assert nothing"
        run: sh scripts/check_unwired_guards.sh

  xcode_test:
    name: "Build & Test — ${{ matrix.simulator }} (macos-26 / Xcode 26)"
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        simulator: ["iPad Pro 13-inch (M5)", "iPad (A16)"]
    # D9 (ROADMAP_V5): hard cap on the simulator job so a hung
    # xcodebuild can't sit at "in_progress" until GitHub's 6-hour
    # default kills it. Typical completion is 4–7 minutes; 20 is
    # generous headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Show Xcode + Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: List available iPad simulators
        run: xcrun simctl list devices available | grep -i ipad

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Primae/Primae.xcodeproj \
            -scheme Primae

      # Debug-Study, not Debug (2026-09-14): STUDY_BUILD is now
      # unconditional in Package.swift (every build of the package IS a
      # study build, full stop — see Package.swift and CLAUDE.md "Study
      # builds"), so the plain Debug/Release configuration's own linker
      # requirement (`-u _primae_build_identity_normal`) can no longer be
      # satisfied by anything — that configuration cannot link at all
      # anymore, not just "isn't exercised here". This is the main test
      # job; it has to build the one configuration that still links.
      - name: Build & Test — iPad simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project Primae/Primae.xcodeproj \
            -scheme Primae \
            -destination 'platform=iOS Simulator,name=${{ matrix.simulator }},OS=latest' \
            -configuration Debug-Study \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            -resultBundlePath /tmp/TestResults.xcresult \
            2>&1 | tee /tmp/xcode-test.log

      - name: Extract failure summary
        if: failure()
        run: |
          ERRORS=$(grep -E "error:|#expect.*failed|XCTAssert.*failed|Test.*FAILED" \
            /tmp/xcode-test.log 2>/dev/null \
            | grep -v "^Binary" | head -15 \
            || echo "See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          printf '%s' "$ERRORS" > /tmp/ci_errors.txt
          cat /tmp/ci_errors.txt

      # NOTE: P1 fix tasks are now injected automatically by AutoCoder ci_fix.py
      # via polling GitHub CI — no workflow step needed

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcode-test-results-${{ strategy.job-index }}
          if-no-files-found: warn
          path: |
            /tmp/xcode-test.log
            /tmp/TestResults.xcresult

  study_build:
    name: "Study build — identity + compile-out verification (macos-26 / Xcode 26)"
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Primae/Primae.xcodeproj -scheme Primae

      # ---------------------------------------------------------------
      # CONTROL A ("Debug-Study without the flag must FAIL to link") lived
      # here and is REMOVED (2026-09-14), not just passing differently: its
      # entire premise was that a "flagless" Debug-Study build was possible
      # and had to be proven to fail — the Cmd-R trap. STUDY_BUILD is now
      # unconditional in Package.swift, so there is no flagless state left
      # to construct; every build of the package IS a study build, and a
      # control asserting "the thing that can no longer happen must fail"
      # would be asserting nothing, not a weaker version of the same
      # guarantee. Removed rather than left green-by-vacuity. The identity
      # scan below still does real, unrelated work: it verifies the
      # SHIPPED artefact actually carries the right identity symbol and
      # none of the compiled-out surfaces, regardless of how STUDY_BUILD
      # reached the package.
      # ---------------------------------------------------------------

      # ---------------------------------------------------------------
      # SCHEME-DRIVEN BUILD (2026-09-14) — the check that actually caught
      # a real defect the same day it was added: every OTHER build in this
      # workflow passes `-configuration` explicitly, which is not how
      # David presses Run in Xcode. He picks a scheme, picks a
      # destination, and presses the button — no `-configuration`
      # anywhere, so whatever the SCHEME's own Launch action names as its
      # default is what actually gets built. A script build succeeding
      # proves nothing about that path; this step is deliberately the
      # thing that failed once already (a since-deleted "Primae" scheme
      # whose Launch action still pointed at the casual Debug
      # configuration, which could no longer link once STUDY_BUILD went
      # unconditional — `_primae_build_identity_normal` no longer exists
      # to satisfy the `-u`). Omitting `-configuration` here is the point,
      # not an oversight.
      # ---------------------------------------------------------------
      - name: "Scheme-driven build, no -configuration override (what Xcode's Run button actually does)"
        run: |
          set -o pipefail
          xcodebuild build \
            -project Primae/Primae.xcodeproj \
            -scheme Primae \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/dd-scheme-run \
            CODE_SIGNING_ALLOWED=NO ENABLE_DEBUG_DYLIB=NO \
            2>&1 | tee /tmp/scheme-run-build.log | tail -20
          APP=$(find /tmp/dd-scheme-run/Build/Products -maxdepth 2 -type d -name "Primae.app" | head -1)
          if [ -z "$APP" ]; then
            echo "FAIL  scheme-driven build produced no Primae.app — see /tmp/scheme-run-build.log"
            exit 1
          fi
          # Scan every Mach-O in the bundle, not just a hardcoded
          # "$APP/Primae" path — an app executable can be a launcher stub
          # with the real code in a sibling Mach-O (same reason the
          # identity/SURFACES scan below does this; a naive single-file
          # check here is what caused this exact step to false-fail on
          # 2026-09-14: the build genuinely succeeded and carried the
          # identity symbol, `nm` just wasn't pointed at the right file).
          FOUND=0
          while IFS= read -r f; do
            case "$(file -b "$f" 2>/dev/null)" in
              *Mach-O*)
                if nm -jU "$f" 2>/dev/null | grep -qx "_primae_build_identity_study"; then FOUND=1; fi
                ;;
            esac
          done < <(find "$APP" -type f)
          if [ "$FOUND" -eq 1 ]; then
            echo "ok    scheme-driven build (no -configuration) resolved to the study identity"
          else
            echo "FAIL  scheme-driven build did not carry _primae_build_identity_study in any"
            echo "      Mach-O in the bundle — it resolved to a configuration Xcode's Run button"
            echo "      would not use, or the wrong one. This is exactly the failure mode this"
            echo "      step exists to catch."
            exit 1
          fi

      - name: "Build & test the study build"
        run: |
          set -o pipefail
          PRIMAE_DESTINATION='platform=iOS Simulator,name=iPad (A16),OS=latest' \
          PRIMAE_DERIVED_DATA=/tmp/dd-study \
            scripts/build_study.sh test \
              -enableCodeCoverage NO \
              2>&1 | tee /tmp/study-test.log | tail -20

      # The artefact that gets SCANNED must be built the same way as the
      # one it is compared against. The `test` action above produced an
      # arm64-only launcher stub (218 KB, 702 symbols) whose real code
      # lives elsewhere, while the normal `build` action produced a
      # universal 22 MB executable — not comparable, and the reason the
      # identity symbol appeared absent. Same action, same destination.
      - name: "Build the study build for scanning (build action, generic destination)"
        run: |
          set -o pipefail
          PRIMAE_DESTINATION='generic/platform=iOS Simulator' \
          PRIMAE_DERIVED_DATA=/tmp/dd-study-scan \
            scripts/build_study.sh build \
              2>&1 | tee /tmp/study-scan-build.log | tail -5

      # The PILOT ARTEFACT is Release-Study, and until now nothing had
      # ever built it. A successful link is itself the identity proof:
      # Release-Study carries `-u _primae_build_identity_study`, so it
      # cannot link unless the package was compiled with the flag.
      #
      # This is also the only -O build in the whole workflow, which makes
      # it the only job that would notice swiftlang/swift#88173 (an
      # inliner crash with -default-isolation MainActor + -O, our exact
      # configuration). It cannot speak for Xcode 27 — see ROADMAP F11 —
      # but it stops Release-Study from being a configuration nobody has
      # compiled.
      - name: "Build the pilot artefact (Release-Study, -O)"
        run: |
          set -o pipefail
          PRIMAE_CONFIGURATION=Release-Study \
          PRIMAE_DESTINATION='generic/platform=iOS Simulator' \
          PRIMAE_DERIVED_DATA=/tmp/dd-release-study \
            scripts/build_study.sh build \
              2>&1 | tee /tmp/release-study-build.log | tail -5

      # ---------------------------------------------------------------
      # Identity is checked with `nm`, not `strings`: a symbol's presence
      # is a fact the linker was required to enforce.
      #
      # The scan reads the whole .app bundle, not just the executable. An
      # app executable can be a launcher stub with the real code in a
      # sibling Mach-O (ENABLE_DEBUG_DYLIB, embedded frameworks), and
      # `nm` on a stub reports absence exactly like a missing symbol.
      # ---------------------------------------------------------------
      - name: "Build identity — nm scan over the study bundle"
        run: |
          {
          rc=0

          locate_app() { # $1=derivedData  $2=glob
            hit=$(find "$1/Build/Products" -maxdepth 3 -type d -path "$2" 2>/dev/null | head -1)
            [ -z "$hit" ] && hit=$(find "$1" -maxdepth 6 -type d -path "$2" 2>/dev/null | head -1)
            FOUND="$hit"
          }

          machos() { # $1=bundle -> every Mach-O file inside it
            find "$1" -type f 2>/dev/null | while read -r f; do
              case "$(file -b "$f" 2>/dev/null)" in *Mach-O*) echo "$f";; esac
            done
          }

          bundle_syms() { # $1=bundle -> total defined symbols across all Mach-O
            machos "$1" | while read -r f; do nm -jU "$f" 2>/dev/null | wc -l; done \
              | awk '{s+=$1} END{print s+0}'
          }

          describe() { # $1=label $2=bundle $3=derivedData $4=glob -> 0 ok / 1 not found
            if [ -z "$2" ]; then
              echo "FAIL  APP BUNDLE NOT FOUND for the $1 build."
              echo "      Nothing matched  $4  under  $3"
              echo "      This is a LOCATION failure. It is NOT a missing symbol."
              echo "      What is actually present:"
              present=$(find "$3/Build/Products" -maxdepth 3 2>/dev/null | head -40)
              if [ -n "$present" ]; then echo "$present" | sed 's/^/      /'
              else echo "      (nothing — $3/Build/Products is empty or absent)"; fi
              return 1
            fi
            echo "$1 bundle: $2"
            machos "$2" | while read -r f; do
              echo "    $(basename "$f")  $(stat -f%z "$f") bytes  [$(lipo -archs "$f" 2>/dev/null || echo '?')]  $(nm -jU "$f" 2>/dev/null | wc -l | tr -d ' ') defined symbols"
            done
            echo "    TOTAL defined symbols in bundle: $(bundle_syms "$2")"
            return 0
          }

          locate_app /tmp/dd-study-scan '*/Debug-Study-*/Primae.app'; STUDY="$FOUND"

          describe study "$STUDY" /tmp/dd-study-scan '*/Debug-Study-*/Primae.app' || rc=1

          # -------------------------------------------------------------
          # Plausibility floor, replacing the old study-vs-normal ratio
          # check (2026-09-13: normal is no longer built here to compare
          # against — see CLAUDE.md "The casual path is paused"). A
          # launcher stub (real code in a sibling Mach-O, e.g. the `test`
          # action's arm64-only stub) measured 702 symbols; a real study
          # bundle measured 20850 (run 34048770455). 5000 sits an order of
          # magnitude above the stub and well below the real figure.
          # -------------------------------------------------------------
          if [ -n "$STUDY" ]; then
            SS=$(bundle_syms "$STUDY")
            echo "study defined symbols: $SS"
            if [ "$SS" -lt 5000 ]; then
              echo "FAIL  IMPLAUSIBLY FEW SYMBOLS ($SS) — looks like a launcher stub"
              echo "      (real code in a sibling Mach-O) rather than the full app."
              rc=1
            fi
          fi

          # -------------------------------------------------------------
          # Identity, searched across every Mach-O in the bundle. Only the
          # study half is built here now, but the check itself was always
          # self-contained per bundle (asks one bundle for both the
          # expected and the forbidden symbol), so it needs no change.
          # -------------------------------------------------------------
          identity_hits() { # $1=bundle $2=half -> "file" lines carrying that identity
            machos "$1" | while read -r f; do
              if nm -jU "$f" 2>/dev/null | grep -qx "_primae_build_identity_$2"; then echo "$f"; fi
            done
          }

          check() { # $1=label $2=bundle $3=expected half $4=forbidden half
            [ -z "$2" ] && return 0
            want=$(identity_hits "$2" "$3")
            deny=$(identity_hits "$2" "$4")
            if [ -z "$want" ]; then
              echo "FAIL  $1 bundle carries no _primae_build_identity_$3 in ANY Mach-O file."
              echo "      The link demanded it via -u and succeeded, so compare the"
              echo "      per-file symbol counts above — a stub will show far too few."
              rc=1
            else
              echo "ok    $1 identity _primae_build_identity_$3 found in:"
              echo "$want" | sed 's/^/        /'
            fi
            if [ -n "$deny" ]; then
              echo "FAIL  $1 bundle ALSO carries _primae_build_identity_$4 in:"
              echo "$deny" | sed 's/^/        /'
              rc=1
            fi
          }
          check study "$STUDY" study normal

          if [ $rc -eq 0 ]; then
            echo "Build identity OK — study bundle carries exactly its own."
          fi

          # -------------------------------------------------------------
          # Compiled-out surfaces. Each entry is a substring of the Swift
          # mangled name of a declaration that must be absent from the
          # study bundle. Previously also required present-in-normal, to
          # catch a renamed symbol passing vacuously — normal is no longer
          # built here (see CLAUDE.md), so that guard is gone with it: an
          # accepted, documented reduction in coverage, not a silent one.
          # -------------------------------------------------------------
          sym_in_bundle() { # $1=bundle $2=pattern -> files whose symbols match
            machos "$1" | while read -r f; do
              if nm -jU "$f" 2>/dev/null | grep -q "$2"; then echo "$f"; fi
            done
          }

          SURFACES="debugPercentReadout
                    WerkstattWorldView
                    FortschritteWorldView
                    OnboardingView
                    StrokeCalibrationOverlay
                    ParentDashboardView
                    PhaseRatesView
                    PaperTransferView
                    CompletionCelebrationOverlay
                    RewardCelebrationOverlay
                    RetrievalPromptView
                    RecognitionFeedbackView
                    freeWriteKPOverlay
                    LetterWheelPicker
                    FreeformWritingView
                    PracticeTrendChart
                    variantToggle"
          if [ -n "$STUDY" ]; then
            for sym in $SURFACES; do
              in_study=$(sym_in_bundle "$STUDY" "$sym")
              if [ -n "$in_study" ]; then
                echo "FAIL  $sym is still IN the study bundle:"
                echo "$in_study" | sed 's/^/        /'
                rc=1
              else
                echo "ok    $sym absent from study"
              fi
            done
          fi

          # -------------------------------------------------------------
          # On-device identity. `nm` proves the LINKER cannot conflate a
          # study and a normal binary; nothing above proves a PROCTOR
          # can't tell them apart on a home screen. Previously diffed
          # against a normal bundle built in this same job; normal isn't
          # built here anymore (CLAUDE.md, "The casual path is paused"),
          # so this now asserts the study bundle's own identity equals the
          # literal constants project.pbxproj sets for it, rather than
          # diffing against a sibling build. Read from the bundle's OWN
          # generated Info.plist, not the pbxproj source — a build setting
          # that never reached the plist protects nobody.
          # -------------------------------------------------------------
          plist_value() { # $1=bundle $2=key -> value or "" if absent/unreadable
            # `|| true`: PlistBuddy exits non-zero for a missing key, and this
            # step runs under `bash -e` (GitHub Actions' default) — a bare
            # command substitution's failure there aborts the whole script
            # BEFORE the `if [ -z ... ]` handling below ever runs, which is
            # exactly what happened to the CFBundleIconName probe (found live,
            # run 34575684230: every check up to display-name passed, then
            # the step died with no output from the icon-name block at all).
            # A missing key must produce an empty string here, not a death.
            /usr/libexec/PlistBuddy -c "Print :$2" "$1/Info.plist" 2>/dev/null || true
          }
          if [ -n "$STUDY" ]; then
            study_id=$(plist_value "$STUDY" CFBundleIdentifier)
            study_name=$(plist_value "$STUDY" CFBundleDisplayName)
            if [ "$study_id" != "com.flamingistan.primae.study" ]; then
              echo "FAIL  study CFBundleIdentifier is '$study_id', expected"
              echo "      com.flamingistan.primae.study — a proctor cannot rely on"
              echo "      this build never overwriting a casual install."
              rc=1
            else
              echo "ok    study CFBundleIdentifier = $study_id"
            fi
            if [ "$study_name" != "Primae Studie" ]; then
              echo "FAIL  study CFBundleDisplayName is '$study_name', expected 'Primae Studie'."
              rc=1
            else
              echo "ok    study CFBundleDisplayName = $study_name"
            fi
            study_orientations=$(plist_value "$STUDY" "UISupportedInterfaceOrientations~ipad")
            if echo "$study_orientations" | grep -q "Portrait"; then
              echo "FAIL  study UISupportedInterfaceOrientations~ipad allows Portrait:"
              echo "$study_orientations" | sed 's/^/        /'
              echo "      A mid-session rotation re-maps checkpoints and changes the"
              echo "      letter's physical size — the study configuration must be"
              echo "      landscape-only."
              rc=1
            else
              echo "ok    study UISupportedInterfaceOrientations~ipad has no Portrait entry:"
              echo "$study_orientations" | sed 's/^/        /'
            fi
          fi

          echo "SCAN_RESULT=$rc"
          } 2>&1 | tee /tmp/identity-scan.log
          grep -qx 'SCAN_RESULT=0' /tmp/identity-scan.log

      - name: Upload study build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: study-build-logs
          if-no-files-found: warn
          path: |
            /tmp/guard-a.log
            /tmp/study-test.log
            /tmp/study-scan-build.log
            /tmp/release-study-build.log
            /tmp/identity-scan.log

