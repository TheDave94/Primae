name: "Bake gates (G1/G3/G4/G6)"

# Phase 2b Track B operational closure (G5): runs the three calibrated
# drift-from-reference gates as PR merge-blockers when strokes.json
# files or gate code change. Design + rationale at
# research_data/phase2b_gates/g5_design.md.
#
# G2 (turn-angle drift) is NOT invoked here — investigated 2026-05-23
# and documented as not-viable; see g2_calibration_run.md.
#
# G6 (T-junction attachment-tangent drift, Phase 2c) added 2026-05-26.
# Mirrors G4's step structure for the T-junction geometric class. Design
# + rationale at research_data/phase2b_gates/g6_design.md +
# phase2c_design.md G6 section.
#
# G7 (stroke start/end position drift = direction + start point) added
# 2026-10-13 (audit G3-05): G1/G3/G4/G6 are all invariant to reversing a
# stroke. Its threshold is PROVISIONAL (see audit_invariants.py). The job
# and its name are left as they were on purpose -- renaming a job renames
# the required status check.

# THE `pull_request` TRIGGER BELOW NEVER FIRES FOR THE PULL REQUESTS THIS
# PROJECT OPENS. MEASURED 2026-10-15: every run this workflow has ever had
# came from a GitHub pull request or a manual dispatch — the last was
# 2026-08-21 — because a pull request here is opened on the FORGE
# (git.flamingistan.com), and the GitHub repo is a push mirror that never sees
# one. So the gate this file's header calls a merge-blocker had not run
# against a real change since the move to forge-origin PRs.
#
# `push` is what reaches the mirror, and it is what restores the gate. The
# `pull_request` block is kept rather than swapped out because a GitHub-side
# pull request (a Copilot agent's, say) is still a real shape this gate should
# answer to; it costs nothing to keep and the duplication is named below.
#
# THE TWO `paths` LISTS MUST STAY IDENTICAL. GitHub Actions has no YAML
# anchors and no way to share one list between two event types, so a path
# added to one block and not the other silently narrows a trigger that still
# reads as complete in the diff.
on:
  push:
    branches: ["main", "ux/**", "roadmap-*", "feat/**", "fix/**"]
    paths:
      - "PrimaeNative/Resources/Letters/Regular/**/strokes.json"
      - "PrimaeNative/Resources/Letters/Light/**/strokes.json"
      - "scripts/audit_invariants.py"
      - "scripts/run_gates.py"
      - "scripts/tests/**"
      - "scripts/calibration_to_override.py"
      - "scripts/calibrate_g6_threshold.py"
      - "scripts/skeleton_audit.py"
      - "scripts/g7_allowlist.json"
      - "scripts/generate_letter_audio.py"
      - "scripts/generate_prompts.py"
      - "scripts/verify_bake.sh"
      - "scripts/render_checklist.py"
      - "scripts/render_dryrun.py"
      - ".gitignore"
      - "docs/TESTING_CHECKLIST.md"
      - "docs/testing_checklist.html"
      - "docs/STUDY_DEVICE_DRYRUN.md"
      - "docs/STUDY_DEVICE_DRYRUN.html"
      - "scripts/generate_strokes_auto.py"
      - "design-system/fonts/**"
      - ".github/workflows/bake-gates.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "PrimaeNative/Resources/Letters/Regular/**/strokes.json"
      - "PrimaeNative/Resources/Letters/Light/**/strokes.json"
      - "scripts/audit_invariants.py"
      - "scripts/run_gates.py"
      - "scripts/tests/**"
      - "scripts/calibration_to_override.py"
      - "scripts/calibrate_g6_threshold.py"
      - "scripts/skeleton_audit.py"
      - "scripts/g7_allowlist.json"
      # Inputs of scripts/tests/test_scripts_hygiene.py and
      # test_rendered_docs_in_sync.py: without these a change that breaks
      # them would not trigger the job that runs them.
      - "scripts/generate_letter_audio.py"
      - "scripts/generate_prompts.py"
      - "scripts/verify_bake.sh"
      - "scripts/render_checklist.py"
      - "scripts/render_dryrun.py"
      - ".gitignore"
      - "docs/TESTING_CHECKLIST.md"
      - "docs/testing_checklist.html"
      - "docs/STUDY_DEVICE_DRYRUN.md"
      - "docs/STUDY_DEVICE_DRYRUN.html"
      # The gates rasterise through the bake module and read its font:
      # SIZE/PAD/optical bbox and the .otf bytes define the px frame
      # every threshold is calibrated in (audit 2026-09-04).
      - "scripts/generate_strokes_auto.py"
      - "design-system/fonts/**"
      - ".github/workflows/bake-gates.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bake-gates:
    name: "Bake gates (G1 / G3 / G4 / G6)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch origin/main for reference comparison
        run: |
          git fetch origin main:refs/remotes/origin/main
          git rev-parse origin/main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pillow numpy scipy fonttools "scikit-image>=0.21"

      - name: G1 — asymmetry-profile drift from reference
        run: |
          python3 scripts/run_gates.py --gate g1 \
            --reference-ref origin/main

      - name: G1 — JSON output (artifact)
        if: always()
        run: |
          python3 scripts/run_gates.py --gate g1 \
            --reference-ref origin/main --json > g1.json \
            || true  # JSON capture should not block on gate failure
                     # (the gating step above already failed if needed)

      - name: G3 — perpendicular deviation on straight strokes
        run: |
          python3 scripts/run_gates.py --gate g3 \
            --reference-ref origin/main

      - name: G3 — JSON output (artifact)
        if: always()
        run: |
          python3 scripts/run_gates.py --gate g3 \
            --reference-ref origin/main --json > g3.json \
            || true

      - name: G4 — junction-tangent-kink drift from reference
        run: |
          python3 scripts/run_gates.py --gate g4 \
            --reference-ref origin/main

      - name: G4 — JSON output (artifact)
        if: always()
        run: |
          python3 scripts/run_gates.py --gate g4 \
            --reference-ref origin/main --json > g4.json \
            || true

      - name: G6 — T-junction attachment-tangent drift from reference
        run: |
          python3 scripts/run_gates.py --gate g6 \
            --reference-ref origin/main

      - name: G6 — JSON output (artifact)
        if: always()
        run: |
          python3 scripts/run_gates.py --gate g6 \
            --reference-ref origin/main --json > g6.json \
            || true

      - name: G7 — stroke direction / start point (ADVISORY until David confirms the 40 px thresholds)
        # Advisory on purpose: G7_DEFAULT_THRESHOLD_PX / G7_PATH_THRESHOLD_PX
        # are audit-lane PROPOSALS (thesis-adjacent; margin on the weakest
        # stroke is ~1.25x, see audit_invariants.py). A red step here is a
        # signal to look, not a merge block. The G7 UNIT TESTS below stay
        # blocking. Intended direction changes go in scripts/g7_allowlist.json.
        continue-on-error: true
        run: |
          python3 scripts/run_gates.py --gate g7 \
            --reference-ref origin/main

      - name: G7 — JSON output (artifact)
        if: always()
        run: |
          python3 scripts/run_gates.py --gate g7 \
            --reference-ref origin/main --json > g7.json \
            || true

      - name: Gate and script-safety unit tests
        if: always()
        # Not advisory: these pin what the 2026-10-13 audit closed
        # (reversed stroke - open or a closed loop - must fail G7; the
        # allow-list admits only the exact recorded change; a deleted letter
        # folder must fail;
        # G4 sees non-consecutive junctions; the writers validate and write
        # atomically). fetch-depth 0 above lets the real-corpus checks
        # (the caff3472 A allow-list entry vs git history) run instead of
        # skipping. Written and
        # mutation-checked without numpy/PIL available, so the first CI run
        # is the first run against the real libraries.
        run: |
          pip install --quiet pytest
          python3 -m pytest -q \
            scripts/tests/test_gate_g4.py::TestG4NonConsecutiveJunction \
            scripts/tests/test_gate_g7.py \
            scripts/tests/test_run_gates.py \
            scripts/tests/test_calibration_to_override.py \
            scripts/tests/test_calibrate_g6_cli.py \
            scripts/tests/test_bake_cli_safety.py \
            scripts/tests/test_skeleton_audit.py \
            scripts/tests/test_scripts_hygiene.py \
            scripts/tests/test_rendered_docs_in_sync.py

      - name: Bake smoke - dry-bake every LETTERS spec (advisory)
        if: always()
        continue-on-error: true
        # All 37 LETTERS entries are static artifacts, so skeleton_audit's
        # default run skips every one and the ~4,000 lines of bake
        # primitives had no CI execution (audit G3-03). This lifts the
        # guard for a dry bake (nothing is written). Advisory until one run
        # has been read: it reports on code CI has never run, and the
        # specs may have rotted.
        run: python3 scripts/skeleton_audit.py --include-static

      - name: Light corpus — G1 + G3 (advisory; thresholds were calibrated on Regular)
        if: always()
        continue-on-error: true
        run: |
          # The Light weight is not in the pilot and no gate ran on it at
          # all (audit 2026-09-05). Advisory until its thresholds are
          # calibrated; a PR rewriting Light/ now at least triggers this.
          python3 scripts/run_gates.py --gate g1 --weight light --reference-ref origin/main
          python3 scripts/run_gates.py --gate g3 --weight light --reference-ref origin/main
          python3 scripts/run_gates.py --gate g7 --weight light --reference-ref origin/main

      - name: Upload gate JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bake-gate-results
          path: |
            g1.json
            g3.json
            g4.json
            g6.json
            g7.json
          if-no-files-found: warn

  # THE PUSH BRIDGE WAS HERE, AND IT IS GONE — same measurement and the same
  # reason as ios-build.yml's removed `report_forge_status` job (see the note
  # at the end of that file). The verdict is pulled from inside the network by
  # `.forgejo/workflows/ci-verdict-bridge.yml` instead.
  #
  # THE `push:` TRIGGER ABOVE STAYS, and it matters MORE now than it did
  # before: it is what makes GitHub run these gates at all for a push that
  # originated on the forge. The poller has no verdict to read if this workflow
  # never runs on the mirrored commit.
